<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cartão de Personagem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🎮 Bem-vindo(a)! Você vai criar o CARTÃO DE PERSONAGEM do seu jogo. -->
  <!-- Todo mundo começa com o mesmo HTML, mas o CSS de cada um vai ficar diferente. Solte a criatividade! -->
  
  <main class="cartao" id="cartao-personagem">

    <div class="avatar"></div>

    <h1 class="nome">HALLAND</h1> 
    <p class="classe">Classe: Mago</p>

    <div class="nivel">
      <span>Nível 1</span>
    </div>

    <div class="barra-fundo">
      <div class="barra-vida"></div>
    </div>

    <div class="barra-fundo">
      <div class="barra-xp"></div>
    </div>

    <ul class="atributos">
      <li class="atributo">⚔️ Força: 8</li>
      <li class="atributo">🛡️ Defesa: 5</li>
      <li class="atributo">💨 Velocidade: 6</li>
    </ul>

    <p class="descricao">
      Mago viking com atributos sobrenaturais da geração Hall!
    </p>

    <button class="botao-acao">Atacar!</button>

  </main>

</body>
</html>
