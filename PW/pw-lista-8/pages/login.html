<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftsy | Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header container">
    <div class="header-esquerda">
      <a href="../index.html"><img src="../assets/logo.png" alt="Logo Craftsy"></a>
      <nav>
        <ul class="menu">
          <li><a href="#">Smartphones</a></li>
          <li><a href="#">Tablets</a></li>
          <li><a href="#">Computadores</a></li>
        </ul>
      </nav>
    </div>
    <ul class="menu">
      <li><a href="login.html">Login</a></li>
      <li><a href="registrar.html">Registrar</a></li>
    </ul>
  </header>

  <!-- Formulário de login -->
  <main class="container">
    <form class="formulario" action="#" method="post">
      <h1>Bem-vindo</h1>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="caixa-texto" placeholder="email@email.com">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" class="caixa-texto" placeholder="senha">
      </div>

      <div class="campo lembrar">
        <input type="checkbox" id="lembrar" name="lembrar">
        <label for="lembrar" class="opcao">Lembrar de mim</label>
      </div>

      <p class="erro">A combinação de email e senha não é válida.</p>

      <button type="submit" class="botao">Entrar</button>
    </form>
  </main>

</body>
</html>
